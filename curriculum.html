<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b70">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="rusa-192.png">
  <title>Curriculum — Pandit Deendayal Upadhyaya Adarsha Mahavidyalaya</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    header {
      background: linear-gradient(135deg, #123b70, #1f6fb2);
      color: #ffffff;
      padding: 26px 20px;
      text-align: center;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .header-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 50%;
      padding: 4px;
      flex-shrink: 0;
    }

    .header-text {
      text-align: left;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 22px;
      line-height: 1.25;
    }

    .header-subtitle {
      margin: 0 0 2px;
      opacity: 0.9;
      font-size: 14px;
    }

    .header-tagline {
      margin: 0;
      opacity: 0.85;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .header-inner {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }

      .header-text {
        text-align: center;
      }

      header h1 {
        font-size: 19px;
      }

      .header-logo {
        width: 52px;
        height: 52px;
      }
    }

    main {
      max-width: 900px;
      margin: 28px auto;
      padding: 0 16px 32px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #1f6fb2;
      font-weight: bold;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .syllabus-link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: linear-gradient(135deg, #123b70, #1f6fb2);
      color: #ffffff;
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 24px;
      text-decoration: none;
    }

    .syllabus-link-text {
      font-size: 17px;
      font-weight: bold;
    }

    .syllabus-link-subtext {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 3px;
      font-weight: normal;
    }

    .syllabus-link-arrow {
      font-size: 22px;
      flex-shrink: 0;
    }

    .syllabus-link-card:hover {
      background: linear-gradient(135deg, #0e2c54, #15578e);
    }

    .section-heading {
      margin: 8px 2px 14px;
      color: #123b70;
      font-size: 17px;
    }

    .summary {
      margin: 0 2px 18px;
      color: #536174;
      font-size: 14px;
    }

    .notice-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(20, 48, 84, 0.10);
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .notice-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .notice-title {
      font-size: 16px;
      font-weight: bold;
      color: #123b70;
    }

    .notice-date {
      font-size: 13px;
      color: #6b7280;
      white-space: nowrap;
    }

    .notice-file-link {
      display: inline-block;
      margin-top: 4px;
      background: #1f6fb2;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 8px;
    }

    .notice-file-link:hover {
      background: #15578e;
    }

    .empty,
    .loading {
      padding: 30px;
      text-align: center;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <img src="rusa.jpg" alt="RUSA logo" class="header-logo">
      <div class="header-text">
        <h1>Pandit Deendayal Upadhyaya Adarsha Mahavidyalaya</h1>
        <p class="header-subtitle">Amjonga, Goalpara, Assam &middot; Affiliated to Gauhati University</p>
        <p class="header-tagline">Curriculum &amp; Course Resources</p>
      </div>
    </div>
  </header>

  <main>
    <a class="back-link" href="index.html">&larr; Back to Class Routine</a>

    <a
      class="syllabus-link-card"
      href="https://gauhati.ac.in/syllabus/"
      target="_blank"
      rel="noopener"
    >
      <span>
        <span class="syllabus-link-text">Gauhati University Syllabus</span><br>
        <span class="syllabus-link-subtext">Opens the official GU syllabus page in a new tab</span>
      </span>
      <span class="syllabus-link-arrow">↗</span>
    </a>

    <div class="section-heading">Other Course Documents</div>
    <div id="curriculumSummary" class="summary">Loading…</div>

    <div id="curriculumContainer">
      <div class="loading">Loading…</div>
    </div>
  </main>

  <script src="github-files.js"></script>
  <script>
    loadFolderFiles('curriculum', 'curriculumContainer', 'curriculumSummary');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('service-worker.js').catch(function(error) {
          console.error('Service worker registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>
